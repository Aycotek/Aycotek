    <style>
        :root {
            --glow-color: #fff700;
        }
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        /* --- Fond étoilé animé --- */
        .stars, .twinkling {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .stars {
            background: #000 url(https://www.script-tutorials.com/demos/360/images/stars.png) repeat top center;
            z-index: -3;
        }
        .twinkling {
            background: transparent url(https://www.script-tutorials.com/demos/360/images/twinkling.png) repeat top center;
            z-index: -2;
            animation: move-twink-back 200s linear infinite;
        }
        @keyframes move-twink-back {
            from { background-position: 0 0; }
            to { background-position: -10000px 5000px; }
        }

        /* --- Styles du système solaire --- */
        .solar-system-container {
            transition: transform 1s ease-in-out;
        }
        .sun {
            box-shadow: 0 0 120px 30px var(--glow-color), 0 0 40px 10px var(--glow-color) inset;
        }
        .planet {
            transition: all 0.5s ease;
            cursor: pointer;
        }
        .planet:hover {
            transform: scale(1.15);
            filter: brightness(1.2);
        }
        .planet-label {
            position: absolute;
            bottom: -20px;
            width: 150px;
            text-align: center;
            font-size: 12px;
            color: #a0aec0; /* gray-400 */
            pointer-events: none;
            opacity: 0.8;
        }
        .satellite {
            position: absolute;
            opacity: 0;
            /* La position est gérée par des variables CSS pour permettre l'animation de la taille */
            transform: translate(-50%,-50%) translate(var(--sat-x, 0px), var(--sat-y, 0px)) scale(0.5);
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
        }
        .planet.active .satellite {
            opacity: 1;
            transform: translate(-50%,-50%) translate(var(--sat-x, 0px), var(--sat-y, 0px)) scale(1);
            pointer-events: auto;
        }
        .moon {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #cbd5e0; /* gray-300 */
            border-radius: 9999px;
            cursor: pointer;
            opacity: 0;
            /* Les lunes sont positionnées par rapport au centre de leur satellite parent */
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) translate(var(--moon-x, 0px), var(--moon-y, 0px)) scale(0.5);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 10;
        }
        .moon:hover {
            background-color: #f6e05e; /* yellow-300 */
        }
        .planet.active .satellite .moon {
            opacity: 1;
            transform: translate(-50%, -50%) translate(var(--moon-x, 0px), var(--moon-y, 0px)) scale(1);
            pointer-events: auto;
        }
        .kpi-container {
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .planet.active .kpi-container {
            opacity: 1;
        }

        /* --- Animation de zoom --- */
        .solar-system-container.zoomed-in {
            /* Le scale est maintenant appliqué via un style inline pour un centrage dynamique.
               Cette classe peut être utilisée pour d'autres styles liés au zoom si nécessaire. */
        }

        /* --- Panneau d'information --- */
        #info-panel {
            transition: transform 0.5s ease-in-out;
            transform: translateX(100%);
        }
        #info-panel.visible {
            transform: translateX(0);
        }

        /* --- Styles pour la recherche --- */
        .highlight {
            box-shadow: 0 0 20px 5px #00aaff, 0 0 30px 10px #00aaff inset;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 20px 5px #00aaff, 0 0 30px 10px #00aaff inset; }
            50% { box-shadow: 0 0 30px 10px #00aaff, 0 0 40px 15px #00aaff inset; }
            100% { box-shadow: 0 0 20px 5px #00aaff, 0 0 30px 10px #00aaff inset; }
        }

        // --- Initialisation de l'application ---
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('solar-system-container');
            const infoPanel = document.getElementById('info-panel');
            const panelContent = document.getElementById('panel-content');
            const closePanelBtn = document.getElementById('close-panel');
            const sun = document.getElementById('sun');
            const searchBar = document.getElementById('search-bar');
            const searchResults = document.getElementById('search-results');

            const uniqueDistances = [...new Set(solarSystemData.map(p => p.distance))];

            // Création des orbites
            uniqueDistances.forEach(distance => {
                const orbit = document.createElement('div');
                orbit.className = 'absolute top-1/2 left-1/2 border border-dashed border-gray-700 rounded-full pointer-events-none';
                orbit.style.width = `${distance * 2}px`;
                orbit.style.height = `${distance * 2}px`;
                orbit.style.transform = 'translate(-50%, -50%)';
                container.appendChild(orbit);
            });

            // --- Génération dynamique des planètes ---
            solarSystemData.forEach(planetData => {
                const angleRad = (planetData.angle * Math.PI) / 180;
                const x = Math.cos(angleRad) * planetData.distance;
                const y = Math.sin(angleRad) * planetData.distance;

                // Création de la planète
                const planetEl = document.createElement('div');
                planetEl.id = planetData.id;
                planetEl.className = `planet absolute top-1/2 left-1/2 ${planetData.color} rounded-full flex items-center justify-center`;
                planetEl.style.width = `${planetData.size}px`;
                planetEl.style.height = `${planetData.size}px`;
                planetEl.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;

                // Ajout du nom de la planète
                const label = document.createElement('div');
                label.className = 'planet-label';
                label.textContent = planetData.name;
                planetEl.appendChild(label);

                // Création des KPIs
                const kpiContainer = document.createElement('div');
                kpiContainer.className = 'kpi-container absolute -top-20 w-48 text-center text-xs text-gray-300 bg-black/30 p-2 rounded';
                kpiContainer.innerHTML = planetData.kpis.map(kpi => `<div><strong>${kpi.name}:</strong> ${kpi.value}</div>`).join('');
                planetEl.appendChild(kpiContainer);

                // Création des satellites
                planetData.satellites.forEach(satData => {
                    const satAngleRad = (satData.angle * Math.PI) / 180;
                    const satDistance = (planetData.size / 2) + 30;
                    const satX = Math.cos(satAngleRad) * satDistance;
                    const satY = Math.sin(satAngleRad) * satDistance;

                    const satelliteEl = document.createElement('div');
                    // La classe 'satellite' gère maintenant le positionnement et l'animation via des variables CSS
                    satelliteEl.className = 'satellite w-4 h-4 bg-gray-400 rounded-full cursor-pointer hover:bg-cyan-400';
                    satelliteEl.style.setProperty('--sat-x', `${satX}px`);
                    satelliteEl.style.setProperty('--sat-y', `${satY}px`);

                    satelliteEl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        displayInfoPanel(planetData, satData);
                    });

                    // Création des lunes (sous-processus)
                    if (satData.subProcesses && satData.subProcesses.length > 0) {
                        const moonDistance = 20; // Rayon de l'orbite des lunes
                        satData.subProcesses.forEach((subProcessData, index) => {
                            const moonAngle = (index / satData.subProcesses.length) * (2 * Math.PI);
                            const moonX = Math.cos(moonAngle) * moonDistance;
                            const moonY = Math.sin(moonAngle) * moonDistance;

                            const moonEl = document.createElement('div');
                            moonEl.id = subProcessData.id;
                            moonEl.className = 'moon'; // Le style est maintenant entièrement dans le CSS
                            moonEl.style.setProperty('--moon-x', `${moonX}px`);
                            moonEl.style.setProperty('--moon-y', `${moonY}px`);

                            moonEl.addEventListener('click', (e) => {
                                e.stopPropagation();
                                displaySubProcessInfoPanel(planetData, satData, subProcessData);
                            });

                            satelliteEl.appendChild(moonEl);
                        });
                    }

                    planetEl.appendChild(satelliteEl);
                });

                planetEl.addEventListener('click', () => handlePlanetClick(planetEl, planetData));
                container.appendChild(planetEl);
            });

            // --- Gestion des clics et événements ---
            function resetZoomAndSelection() {
                document.querySelectorAll('.planet.active').forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));
                container.classList.remove('zoomed-in');
                container.style.transform = '';
                infoPanel.classList.remove('visible');
            }

            function handlePlanetClick(planetEl, planetData) {
                const isAlreadyActive = planetEl.classList.contains('active');

                if (isAlreadyActive) {
                    resetZoomAndSelection();
                    return;
                }

                // Réinitialiser avant de zoomer sur une nouvelle planète
                resetZoomAndSelection();

                planetEl.classList.add('active');

                // Affiche la fiche d'identité de la planète dans le panneau
                displayPlanetInfoPanel(planetData);

                const angleRad = (planetData.angle * Math.PI) / 180;
                const x = Math.cos(angleRad) * planetData.distance;
                const y = Math.sin(angleRad) * planetData.distance;
                const scale = 2.5;

                container.classList.add('zoomed-in');
                container.style.transform = `scale(${scale}) translate(${-x}px, ${-y}px)`;
            }

            sun.addEventListener('click', resetZoomAndSelection);

            function displayPlanetInfoPanel(planetData) {
                panelContent.innerHTML = `

                        <h3 class="font-semibold mb-2 text-gray-200">Parties Prenantes Clés</h3>
                        <div class="flex flex-wrap gap-2">
                            ${(planetData.stakeholders || []).map(s => `<span class="bg-gray-700 text-gray-300 px-3 py-1 rounded-full text-sm font-medium">${s}</span>`).join('')}
                        </div>
                    </div>

                    <div>
                        <h3 class="font-semibold mb-2 text-gray-200">Indicateurs Clés (KPIs)</h3>
                        <ul class="space-y-2">
                            ${planetData.kpis.map(kpi => `
                                <li class="bg-gray-800 p-3 rounded-lg flex justify-between items-center">
                                    <span class="font-medium text-gray-100">${kpi.name}</span>
                                    <span class="font-bold text-xl text-cyan-400">${kpi.value}</span>
                                </li>
                            `).join('')}
                        </ul>

                `;
                infoPanel.classList.add('visible');
            }

            function displaySubProcessInfoPanel(planetData, satData, subProcessData) {
                const rightsColors = {
                    'Lecteur': 'bg-blue-500',
                    'Rédacteur': 'bg-green-500',
                    'Approbateur': 'bg-yellow-500'
                };

                panelContent.innerHTML = `
                    <h2 class="text-2xl font-bold text-yellow-400 mb-1">${subProcessData.name}</h2>
                    <p class="text-sm text-gray-400 mb-2">Processus: ${satData.name}</p>
                    <p class="text-sm text-gray-500 mb-4">Macro-processus: ${planetData.name}</p>

                    <div class="mb-6">
                        <h3 class="font-semibold mb-2 text-gray-200">Responsable du sous-processus</h3>
                        <p class="text-gray-300">${subProcessData.owner}</p>
                    </div>

                    <div class="mb-6">
                        <h3 class="font-semibold mb-2 text-gray-200">Droits</h3>
                        <div class="flex flex-wrap gap-2">
                            ${subProcessData.rights.map(r => `<span class="text-xs font-medium px-2 py-1 rounded-full text-white ${rightsColors[r] || 'bg-gray-500'}">${r}</span>`).join('')}

                    <div>
                        <h3 class="font-semibold mb-2 text-gray-200">Documents associés</h3>
                        <ul class="space-y-3">
                            ${subProcessData.documents.map(doc => `
                                <li class="bg-gray-800 p-3 rounded-lg">
                                    <p class="font-medium text-gray-100">${doc.name}</p>
                                    <div class="flex flex-wrap gap-2 mt-2">
                                        ${doc.tags.map(tag => `<span class="text-xs bg-gray-700 text-yellow-400 px-2 py-1 rounded">${tag}</span>`).join('')}
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
                infoPanel.classList.add('visible');
            }

            function displayInfoPanel(planetData, satData) {
                const rightsColors = {
                    'Lecteur': 'bg-blue-500',
                    'Rédacteur': 'bg-green-500',
                    'Approbateur': 'bg-yellow-500'
                };

                panelContent.innerHTML = `
                    <h2 class="text-2xl font-bold text-cyan-400 mb-1">${satData.name}</h2>
                    <p class="text-sm text-gray-400 mb-4">Macro-processus: ${planetData.name}</p>

                    <div class="mb-6">
                        <h3 class="font-semibold mb-2 text-gray-200">Responsable du processus</h3>
                        <p class="text-gray-300">${satData.owner}</p>
                    </div>

                    <div class="mb-6">
                        <h3 class="font-semibold mb-2 text-gray-200">Droits</h3>
                        <div class="flex flex-wrap gap-2">
                            ${satData.rights.map(r => `<span class="text-xs font-medium px-2 py-1 rounded-full text-white ${rightsColors[r] || 'bg-gray-500'}">${r}</span>`).join('')}
                        </div>
                    </div>

                    <div>
                        <h3 class="font-semibold mb-2 text-gray-200">Documents associés</h3>
                        <ul class="space-y-3">
                            ${satData.documents.map(doc => `
                                <li class="bg-gray-800 p-3 rounded-lg">
                                    <p class="font-medium text-gray-100">${doc.name}</p>
                                    <div class="flex flex-wrap gap-2 mt-2">
                                        ${doc.tags.map(tag => `<span class="text-xs bg-gray-700 text-cyan-300 px-2 py-1 rounded">${tag}</span>`).join('')}
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
                infoPanel.classList.add('visible');
            }

            closePanelBtn.addEventListener('click', () => {
                infoPanel.classList.remove('visible');
            });

            // --- Logique de la recherche ---
            searchBar.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                document.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));
                if (query.length < 2) {
                    searchResults.innerHTML = '';
                    searchResults.classList.add('hidden');
                    return;
                }
                const results = [];
                solarSystemData.forEach(planet => {
                    if (planet.name.toLowerCase().includes(query)) {
                        results.push({ type: 'Macro-processus', name: planet.name, elementId: planet.id });
                    }
                    planet.satellites.forEach(satellite => {
                        if (satellite.name.toLowerCase().includes(query)) {
                            results.push({ type: 'Processus', name: satellite.name, context: planet.name, elementId: planet.id });
                        }
                        satellite.documents.forEach(doc => {
                            if (doc.name.toLowerCase().includes(query) || doc.tags.some(tag => tag.toLowerCase().includes(query))) {
                                results.push({ type: 'Document', name: doc.name, context: `${planet.name} > ${satellite.name}`, elementId: planet.id });
                            }
                        });

                        // Ajout de la recherche dans les sous-processus
                        if (satellite.subProcesses) {
                            satellite.subProcesses.forEach(subProcess => {
                                if (subProcess.name.toLowerCase().includes(query)) {
                                    results.push({ type: 'Sous-processus', name: subProcess.name, context: `${planet.name} > ${satellite.name}`, elementId: planet.id });
                                }
                                if (subProcess.documents) {
                                    subProcess.documents.forEach(doc => {
                                        if (doc.name.toLowerCase().includes(query) || doc.tags.some(tag => tag.toLowerCase().includes(query))) {
                                            results.push({ type: 'Document (sous-pr.)', name: doc.name, context: `${planet.name} > ${satellite.name} > ${subProcess.name}`, elementId: planet.id });
                                        }
                                    });
                                }
                            });
                        }
                    });
                });
                displaySearchResults(results);
            });

            function displaySearchResults(results) {
                if (results.length === 0) {
                    searchResults.innerHTML = '<div class="p-3 text-gray-400">Aucun résultat</div>';
                    searchResults.classList.remove('hidden');
                    return;
                }
                searchResults.innerHTML = results.map(r => `
                    <div class="p-3 hover:bg-gray-800 cursor-pointer border-b border-gray-700 search-result-item" data-element-id="${r.elementId}">
                        <p class="font-semibold text-white">${r.name}</p>
                        <p class="text-xs text-gray-400">${r.type} ${r.context ? `(${r.context})` : ''}</p>
                    </div>
                `).join('');
                searchResults.classList.remove('hidden');
                document.querySelectorAll('.search-result-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const elementId = item.dataset.elementId;
                        const planetEl = document.getElementById(elementId);
                        if (planetEl) {
                            handlePlanetClick(planetEl, solarSystemData.find(p => p.id === elementId));
                            planetEl.classList.add('highlight');
                        }
                        searchResults.classList.add('hidden');
                        searchBar.value = item.querySelector('p.font-semibold').textContent;
                    });
                });
            }
        });
    </script>
</body>
</html>
